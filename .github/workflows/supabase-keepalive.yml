name: Manter o Supabase ativo

# O projeto gratuito do Supabase pausa apos cerca de uma semana sem atividade
# no banco. O coletor de noticias grava apenas JSON estatico e nao conta como
# atividade. Esta rotina consulta o banco de hora em hora e, de passagem,
# publica os rascunhos que foram agendados (publish_due_entities).
on:
  schedule:
    # De hora em hora.
    - cron: '0 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: supabase-keepalive
  cancel-in-progress: false
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Consultar o banco
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Faltam os secrets VITE_SUPABASE_URL e VITE_SUPABASE_ANON_KEY."
            exit 1
          fi
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --max-time 30 \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/site_entities?state=eq.published&select=entity&limit=1")
          echo "Consulta ao Supabase: HTTP $status"
          if [ "$status" != "200" ]; then
            echo "O Supabase nao respondeu como esperado. Verifique se o projeto foi pausado."
            exit 1
          fi
      - name: Publicar agendamentos vencidos
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          body=$(curl --silent --max-time 30 \
            -X POST "$SUPABASE_URL/rest/v1/rpc/publish_due_entities" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "Agendamentos publicados: $body"
      - name: Avisar falha no Discord
        if: failure()
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then exit 0; fi
          curl -s -X POST "$DISCORD_WEBHOOK_URL" -H 'Content-Type: application/json' \
            -d '{"username":"Central MBdaR","allowed_mentions":{"parse":[]},"embeds":[{"title":"Falha em keepalive","description":"A rotina falhou. Abra a execucao para conferir.","url":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}","color":14170682}]}' || true
