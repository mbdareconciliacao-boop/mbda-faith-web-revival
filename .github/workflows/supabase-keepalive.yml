name: Manter o Supabase ativo

# O projeto gratuito do Supabase pausa apos cerca de uma semana sem atividade
# no banco. O coletor de noticias grava apenas JSON estatico e nao conta como
# atividade. Esta rotina faz uma consulta diaria real para evitar a pausa.
on:
  schedule:
    # Todos os dias as 06h de Brasilia (09h UTC).
    - cron: '0 9 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: supabase-keepalive
  cancel-in-progress: false
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Consultar o banco
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Faltam os secrets VITE_SUPABASE_URL e VITE_SUPABASE_ANON_KEY."
            exit 1
          fi
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --max-time 30 \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/featured_studies?select=slug&limit=1")
          echo "Consulta ao Supabase: HTTP $status"
          if [ "$status" != "200" ]; then
            echo "O Supabase nao respondeu como esperado. Verifique se o projeto foi pausado."
            exit 1
          fi
