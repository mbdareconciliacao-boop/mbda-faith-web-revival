name: News Scraper
on:
  schedule:
    # Existing cadence preserved: 07:00 and 19:00 BRT.
    - cron: '0 10,22 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: recon-news-static-feed
  cancel-in-progress: false
jobs:
  scrape-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install collector dependencies
        run: python -m pip install -r scripts/requirements.txt
      - name: Install feed validation dependencies
        run: npm ci --ignore-scripts
      - name: Offline collector and domain checks
        run: |
          python -m unittest discover -s tests -p "test_*.py"
          node --test tests/*.test.mjs
      - name: Collect bounded, dated publisher articles
        env:
          NEWS_SOURCES_ALLOWLIST: ${{ vars.NEWS_SOURCES_ALLOWLIST }}
          NEWS_MAX_ITEMS: '60'
          NEWS_MAX_AGE_HOURS: '72'
          NEWS_FILTER_MODE: 'RELAXED'
          NEWS_WRITE_SUPABASE: 'false'
          NEWS_DISCORD_NOTIFY: 'false'
        run: python scripts/news_scraper.py
      - name: Validate and generate syndication feeds
        run: node scripts/generate-feeds.mjs
      - name: Commit only a changed edition
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add src/data/christian_news.json public/data/christian_news.json public/reconnews-feed.json public/reconnews-rss.xml
          if ! git diff --cached --quiet; then
            git commit -m "chore: update verified news edition"
            git push origin HEAD:main
          fi
