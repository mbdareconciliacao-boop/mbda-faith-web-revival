name: Source recovery snapshot

on:
  schedule:
    # Domingo, 02:00 UTC (sábado, 23:00 em Brasília).
    - cron: '0 2 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: source-recovery-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    name: Create a small source snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - id: archive
        name: Archive the current source
        shell: bash
        run: |
          set -euo pipefail
          name="source-snapshot-${GITHUB_SHA::7}"
          mkdir -p snapshot
          git archive --format=tar.gz --output="snapshot/${name}.tar.gz" HEAD
          sha256sum "snapshot/${name}.tar.gz" > "snapshot/${name}.sha256"
          {
            echo "commit=${GITHUB_SHA}"
            echo "created_at=$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo "repository=${GITHUB_REPOSITORY}"
          } > snapshot/metadata.txt
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - name: Upload the recovery snapshot
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.archive.outputs.name }}
          path: snapshot/
          retention-days: 14
          compression-level: 0

      - name: Keep only the two newest source snapshots
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const snapshots = data.artifacts
              .filter(({ expired, name }) => !expired && name.startsWith('source-snapshot-'))
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            for (const artifact of snapshots.slice(2)) {
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              });
            }

      - name: Alert Discord on failure
        if: failure()
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then exit 0; fi
          curl -s -X POST "$DISCORD_WEBHOOK_URL" -H 'Content-Type: application/json' \
            -d '{"username":"Central MBdaR","allowed_mentions":{"parse":[]},"embeds":[{"title":"Falha no snapshot semanal","description":"A rotina falhou. Abra a execução para conferir.","url":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}","color":14170682}]}' || true
