name: Atualizar mensagens do YouTube
on:
  schedule:
    # Terça-feira, 10h de Brasília (UTC-3). O GitHub pode atrasar execuções.
    - cron: '0 13 * * 2'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: youtube-messages
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/sync-youtube.mjs
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - run: npm test && npm run typecheck && npm run build && npm run test:build
      - name: Publicar somente o catálogo validado
        run: |
          git add src/data/youtubeMessages.ts
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'chore: atualizar mensagens do canal da igreja'
            git push origin HEAD:main
          fi
